---
# This workflow runs tests and lint checks on push
name: Checks

# trigger workflow on push to any branch
on: [push]

permissions:
  contents: read

jobs:
  test-lint:
    # user friendly name
    name: Test and Lint
    # github runner
    runs-on: ubuntu-24.04
    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Test
        run: docker compose run --rm recipe_api sh -c "python manage.py wait_for_db && python manage.py test"
      - name: Lint
        run: docker compose run --rm recipe_api sh -c "ruff check --no-cache ."
