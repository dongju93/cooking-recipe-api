services:
  recipe_api:
    build:
      context: .
      args:
        - DEV=true
    ports:
      - target: 8000
        published: 8080
        protocol: tcp
        mode: host
    volumes:
      # Mount entire project root for live code reloading
      - type: bind
        source: .
        target: /cooking_recipe_api
      # Preserve .venv from Docker image (prevent host from overwriting it)
      - type: volume
        target: /cooking_recipe_api/.venv
    working_dir: /cooking_recipe_api/src
    command:
      - sh
      - -c
      - python manage.py wait_for_db && python manage.py migrate && python manage.py runserver 0.0.0.0:8000
    networks:
      - recipe_net
    env_file:
      - ./deploy/postgresql/.env.local
    environment:
      - DB_HOST=recipe_postgres
    depends_on:
      - recipe_postgres

  recipe_postgres:
    image: postgres:18.2
    container_name: recipe_postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - recipe_net
    env_file:
      - ./deploy/postgresql/.env.local
    ports:
      - 5434:5432

volumes:
  postgres_data:
    driver: local

networks:
  recipe_net:
    driver: bridge
